body:
  text: 論大圓曰上半部要人離相見佛下半部要人通達諸法無我覺非曰上半卷純談般若下半卷申明法無我正般若究竟實際也或云前言粗執後言細執前為初發心者說詳於發心之論後為已發心者說直云心無可發至須菩提重問一段大圓以為重復起疑復申前請如如居士以為是另起疑端不是重請紛紛議論迄無定見不知須菩提聞佛所說已悟宗旨其所以再請住降者蓋為末世未能親承佛語之善男女問發心之法欲佛立一法以普示衆生佛故告以實無有法發菩提心細繹經旨似當如是解以後節節將前篇未盡之義反復申明之至善現復問信心復問無得無非為末世衆生說法也佛又即凡所有相四句偈意復申以兩偈其所以滅度衆生者廣矣大矣爾時須菩提白佛言世尊善男子善女人發阿耨多羅三藐三菩提心云何應住云何降伏其心佛告須菩提善男子善女人發阿耨多羅三藐三菩提心者當生如是心我應滅度一切衆生滅度一切衆生已而無有一衆生實滅度者何以故須菩提若菩薩有我相人相衆生相壽者相即非菩薩所以者何須菩提實無有法發阿耨多羅三藐三菩提心者注生如是心句口氣不住直貫下三句我應滅度三句俱指如是心說前云我皆令滅度顯其力此云我應滅度指其願前云滅度無量無邊衆生其量廣此云滅度衆生已其功神前云實無衆生滅度統示平等此云無一衆生滅度細表渾忘總是一義通節皆前文說過惟末句揭出實無有法句此四字當重不特為本節揭旨且為下半卷提綱論此因須菩提為末世衆生請住降法申言實無滅度衆生意而示以發心無法也上卷諸菩薩親承佛教已悟離相之旨特恐末世衆生未能親聞佛語畢竟如來有一法以指示衆生云何降住故有是問與前語氣不同故文稍異空生如前問佛如前答而加以實無有法發心一語見發心尚無法何況住心降心豈更有法乎須菩提求法之心未化佛直從根源處翦除說個實無有法言發菩提本來無法也此後至不生法相俱是引前文而證後義以明無法發心之義講爾時須菩提白佛言無相之旨諸菩薩既得聞命矣但恐末世善男女未能親承佛教所發無上正等覺心者云何可住其心云何可降伏其妄念乎佛言汝知既發正等覺心者當生如是超證一切衆生心舉一切衆生皆消滅其妄念而化度之滅度衆生盡已成佛而無有一衆生實滅度者良由衆生自滅自度我無功也何以故蓋存滅度之心即為著相若菩薩有我人衆壽之相必非菩薩矣所以者何蓋以性本空寂渾然天成其發此心不過自悟自修實無有法發此阿耨多羅三藐三菩提心者須菩提於意云何如來於然燈佛所有法得阿耨多羅三藐三菩提不不也世尊如我解佛所說義佛於然燈佛所無有法得阿耨多羅三藐三菩提佛言如是如是須菩提實無有法如來得阿耨多羅三藐三菩提須菩提若有法如來得阿耨多羅三藐三菩提者然燈佛則不與我授記汝於來世當得作佛號釋迦牟尼以實無有法得阿耨多羅三藐三菩提是故然燈佛與我授記作是言汝於來世當得作佛號釋迦牟尼何以故如來者即諸法如義若有人言如來得阿耨多羅三藐三菩提須菩提實無有法佛得阿耨多羅三藐三菩提須菩提如來所得阿耨多羅三藐三菩提於是中無實無虗是故如來說一切法皆是佛法須菩提所言一切法者即非一切法是故名一切法注佛所說義即上所云實無有法發菩提心也如是如是者其言深契佛心也釋迦華言能仁謂心性純全含容一切也牟尼華言寂默謂心體本寂動靜不遷也寂默為體即是如能仁為用即是來先釋迦而後牟尼者攝用歸體也總是一箇真性加號則為釋迦牟尼通稱則為如來又為佛諸法者一切世間法出世間法也諸法如義者謂諸法真如之義直推到如來本體實無有法也是中即真性中心本真空了無色相故無實色相空處即真性實處故無虗上卷無實無虗以法言此以心言也諸法皆是菩提故云一切法皆佛法不可於諸法外別覓菩提也然一切法非真實人特假此修行故云法即非法不可於諸法內執有菩提也論此申言如來在然燈佛所於法無所得意而示以證果無法也初既無法發心後豈有法得果蓋如來即真性佛真性遍虗空世界而常自如又隨所感而來現靜中生照虗中起白若明鏡空懸憑物之來如物而應影過不留仍存本體故名如來我真實之體本來自如其見之於諸法者亦自然而然來為應述去無留滯如如不動之義也無法云者非頑空斷滅也真如湛寂不立一法萬法皆如不捨一法非法非非法即法即非法總一菩提法界即所謂諸法如義也惟知真如為法體則知法不從外得矣講佛言無上菩提不但無法可發亦無法可得昔我於本師然燈佛處曾有法可得無上菩提否須菩提言我曉佛所言之義佛於本師處乃自性自悟無有傳授祕密而得菩提之道也佛證其語曰如是如是實無有法得此菩提若謂有法然燈佛即諄諄然舉佛之所得者傳之於我不當與我止授一記說汝來世方得作佛號釋迦牟尼乎惟其無得則所證妙果乃性地本具法門然燈佛不過授記而已何曾得法於他何以故如來者不離諸法即諸法中自如之義也或有人說我得此菩提法不知我實從無有法上得來然我所以得此法者皆是我之清淨心中菩提覺性本無形迹此法無有實色相空處師是菩提此法無有虗正謂色即是空空即是色也是故佛說是法皆是般若法然人心未明須賴此法指示迷途除去四相若真空既悟我自得之法亦非有方名為佛法須菩提譬如人身長大須菩提言世尊如來說人身長大即為非大身是名大身須菩提菩薩亦如是若作是言我當滅度無量衆生即不名菩薩何以故須菩提實無有法名為菩薩是故佛說一切法無我無人無衆生無壽者須菩提若菩薩作是言我當莊嚴佛土是不名菩薩何以故如來說莊嚴佛土者即非莊嚴是名莊嚴須菩提若菩薩通達無我法者如來說名真是菩薩注首段設譬以起下文以大身之不實喻諸法之本無譬如人身長大句語未畢空生不待佛竟其說而直言之也非大身者無有身相也是名大身者真如法體廣大無邊也亦如是承上意言菩薩無我相亦如佛之無身相也若作是言三句先反言以明之何以故四句方正釋其義經中或言如來或言菩薩互見錯出其中各有主客言說法則如來為主演說之人為客以演說皆本如來之付囑也言修行則菩薩為主如來為客以此經專問菩薩發心而以如來作準繩也無我我字對上兩我字通達無我法清淨本然一無隔礙也真菩薩者造到純然無僞即等覺也論此申言度生無度嚴土非嚴意而示以菩薩無我法也度衆生是大悲嚴佛土是大智皆菩薩分內事然一念有我便非菩薩若知法空無我直下大悟以至諸相俱空才是真覺悟境界蓋人與衆生壽者其根皆起於有我佛將忘形離相之法都攝入無我中後文復云無我法得成於忍更示人降住之方最是經中精要處講佛問須菩提譬如人身既長且大須菩提答云如來說人身長大者則是非真實大身惟法身乃名大身也佛曰菩薩無我相亦如佛之無身相也若菩薩作是言謂無量衆生皆由我而滅度之是度生有法矣尚得名為菩薩乎何以故真性空空洞洞實無有法名為菩薩正以菩薩以清淨得名耳是故佛說一切法不過開導衆生以悟本性我人衆壽本無四相何得著一衆生相說我當度生乎若菩薩作是言謂我當莊嚴佛土是著有相矣尚得名為菩薩乎何以故如來所說莊嚴佛土者乃心佛土也心土無相本來清淨云何莊嚴六塵不染定慧常存是名莊嚴也夫起度化心著莊嚴相不得名菩薩畢竟發何等心方名為菩薩乎必也四通八達深明無我之法遠離一切諸相如來說名真菩薩矣須菩提於意云何如來有肉眼不如是世尊如來有肉眼須菩提於意云何如來有天眼不如是世尊如來有天眼須菩提於意云何如來有慧眼不如是世尊如來有慧眼須菩提於意云何如來有法眼不如是世尊如來有法眼須菩提於意云何如來有佛眼不如是世尊如來有佛眼須菩提於意云何如恆河中所有沙佛說是沙不如是世尊如來說是沙須菩提於意云何如一恆河中所有沙有如是沙等恆河是諸恆河所有沙數佛世界如是寧為多不甚多世尊佛告須菩提爾所國土中所有衆生若干種心如來悉知何以故如來說諸心皆為非心是名為心所以者何須菩提過去心不可得現在心不可得未來心不可得注觀見形色為肉眼普照大千為天眼智燭常明為慧眼了諸法空為法眼本性常覺為佛眼智慧之體遍照一切法界取喻為眼即所謂般若是也沙等恆河謂一粒沙為一恆河也前恆沙以喻布施此恆沙以喻世界凡有世界必有佛以教化謂之佛世界此喻有五層一舉恆河以數沙再舉一沙一河以數河三約諸沙以數界四約界中所有衆生五約衆生所有心生滅萬狀猶如是沙之多衆生心者顛倒心也若干種者不可縷舉之意攝下過去現在未來三者而言非心者妄想之心非真實之本心也是名為心者不起妄念即是本心也思念前事為過去心思念今事為現在心思念後事為未來心凡人一念中即有過去現在未來須看得活不可得言不可有也論此申言如來悉知悉見意而示以降心之要也眼以矚照為義如來具此五眼觀照衆生妄心纏結事過去而有所係戀事現在而有所執著事未來而有所逆億衆生憧憧往來惟此三心流浪生死如來以不可得三字點破羣迷欲薪積厝頓入清凉惑業久纏立成解脫非心既去即得菩提覺心物有去來心無留滯三際俱空湛虗清淨譬如磨鏡垢盡明見我心之本體如是也如來說經至此已將無住生心三昧處全體昭揭講佛欲闡衆生之心有若干種先設問曰如來有化身觀見之肉眼普照大千之天眼般若常明之慧眼了諸法空之法眼自性常覺之佛眼有此五眼否須菩提皆答之曰如來有五眼佛又舉世界為問曰舉無數恆河之沙以數佛之世界果多乎否須菩提亦以甚多答之佛曰即如如許國土中所有一切衆生各具一心有若干種如來以清淨五眼皆盡見而知之何以故如來所說一切心皆是衆生妄心非性中常住之真心識得妄心非心菩薩本體見矣是名為心也所以者何蓋過去已滅現在本空未來未有衆生戀其往計其在想其來紛紛有此三心三心豈可得而住若能清淨豈有三心無三心而一念不生全體自現則衆生之不終於衆生可知矣須菩提於意云何若有人滿三千大千世界七寶以用布施是人以是因緣得福多不如是世尊此人以是因緣得福甚多須菩提若福德有實如來不說得福德多以福德無故如來說得福德多注因緣者因其布施之功緣之以得福也前云福多是持誦功德此云福多是修證極果取義各別論此第六番較量福德也前文皆與經勝較量此但就福德性較量有無不言持說與前福德性之說遙相照應世間之福富貴功名人見為有實不知福盡墮落仍受輪回故不說福德多出世之福清淨無為不見為福不知能出生死海受大快樂故說福德多此是究竟圓滿地位故不言持說也講佛告須菩提若有人以滿三千大千之七寶用為布施其福德果多否須菩提以甚多答之佛曰若布施之福德身享榮華人見為有實也究之不離業緣有時而盡如來不說福德多若性中之福德自心清淨人以為無也究之本性如來無時而窮故如來說得福德多也彚解自再請住降至此凡五節為一段皆申明上卷之義佛先言發心無法次言證果無法次言度生嚴土皆無我法又以五眼破三心心法俱空正見般若乃是清淨無為妙境其中自具福德量等虗空豈布施因緣所可同日語哉須菩提於意云何佛可以具足色身見不不也世尊如來不應以具足色身見何以故如來說具足色身即非具足色身是名具足色身須菩提於意云何如來可以具足諸相見不不也世尊如來不應以具足諸相見何以故如來說諸相具足即非具足是名諸相具足注具足毫無虧缺也具足色身即八十種隨形好乃佛法之見於身者具足諸相即三十二相乃佛法之見於相者前可以見如來是指人欲以色身見如來言此云如來可以見是謂如來有色相可令人見也不應者謂可以相見固不是謂不可相見亦不是故說不應與不可有別論此申言不可以身相見如來意而示以真空本無色相也前云不可相見是言色相非相相非是佛此云不可相見是言無相即相相非不佛色身原從清淨法身中顯出是為無色之色相好原從真如實相中流露是為無相之相故執色相以為法身固不可離色相以求法身亦不可如來無色無無色不應以色見如來無相無無相不應以相見即非具足明真身也是名具足明應身也可以不應即非是名總是一意講佛曰佛可以具足色身見否須菩提曰不也如來不應以具足色身見何以故蓋色身乃血肉之軀非法身也若法身則無變無壞念念無非般若豈八十種好所能囿也色身中有妙色身存焉是名具足色身佛曰佛可以具足諸相見否須菩提曰不也如來不應以具足諸相見何以故蓋如來所說諸相具足非徒取諸相也般若觀照萬象悉融凡六神通八解脫具於自性中者常滿足爾此妙相如來內有真性如來焉是名諸相具足須菩提汝勿謂如來作是念我當有所說法莫作是念何以故若人言如來有所說法即為謗佛不能解我所說故須菩提說法者無法可說是名說法注上念字是如來說自己之念下念字是說衆生之念謗佛者謂信而不解墮誹謗之見也無法可說者謂本來無法也是名說法者謂示人以真空實相之理使人自悟也論此申言如來無所說法意而示以真空本無法也佛反復告人勿執文字之陳言總以真空之妙理印衆生自有之佛性原以無所住心而說法欲人了徹真性耳於法而言諸法實性妙體空寂原無一法可著於我而言覺心清淨語默皆如本來無法作何言說故說而無說不說而說是名說法也如來臨滅時文殊請佛住世再轉法輪佛言我住世四十九年未嘗說著一字即此意講佛曰須菩提汝見如來日與衆生講解遂謂如來有法可說耶汝莫作是念何以故若人言如來有所說法是謂如來不明真性即為謗佛良由不能解我所說法空之義也須菩提所謂說法者不過謂衆生斷除外妄不得已而有說耳其實真性自如本來無法可說但使自悟真空是名說法也爾時慧命須菩提白佛言世尊頗有衆生於未來世聞說是法生信心不佛言須菩提彼非衆生非不衆生何以故須菩提衆生衆生者如來說非衆生是名衆生此段經文秦譯無魏譯有注慧命謂具智慧通性命即所謂無量佛所種善根也須菩提慧根雖夙具然理境未深則實智不發至聞如來無可說法之時宿種善根於是頓露故立此嘉名未來世兼像法末法時言前問衆生生信就現在言此指未來衆生言前是聞言說章句生信此是聞說是法生信各有淺深聞說是法承上無說之說來衆生與佛同有真性故曰彼非衆生但背真逐妄自喪本來故曰非不衆生如來說非衆生申彼非衆生句是名衆生申非不衆生句論此申言一切衆生即非衆生意而示以衆生相當空也佛說發心而無可發得果而無可得度生而無可度莊嚴而無可莊嚴不以身相見不以說法名善現一一領悟但恐未來衆生聞是無法之法不說之說不能信解無以降住其心因有此問佛言法者真如之性衆生具有佛性一生一佛衆生衆佛但未能發心未能證果未可遽謂非衆生然胎卵濕化諸種尚有變化而脫離其凡胎者何況於人自當泯乎衆生之見彼非衆生非不衆生是如來點化衆生處重說衆生者嘆息而喚醒之與上經三是諸衆生句同一惓切講爾時長老須菩提心開意悟白佛言世尊末法之後頗有衆生聞此無法之法不說之說生信心否佛言佛與衆生同具此般若真性彼雖衆生而真性原有非可以衆生目之彼雖非衆生而業緣現在又非可以不衆生目之何以故凡此衆生衆生者苟能聞般若法而敬信之言下見性是即如來所說非衆生也是假名為衆生爾須菩提白佛言世尊佛得阿耨多羅三藐三菩提為無所得耶佛言如是如是須菩提我於阿耨多羅三藐三菩提乃至無有少法可得是名阿耨多羅三藐三菩提復次須菩提是法平等無有高下是名阿耨多羅三藐三菩提以無我無人無衆生無壽者修一切善法即得阿耨多羅三藐三菩提須菩提所言善法者如來說即非善法是名善法非善法上別本無即字注如來前言無得復言所得空生則合證之發所未發故為佛所深許前云於法無所得但約空寂之體此云乃至無有少法可得是析到至精至微處是法即指菩提覺體無法之法乃真法也平等謂凡有知者必同體也無有高下者非聖具而凡虧也修善法不外般若標一善字以別於魔外也佛又恐衆生於善法生執著故以善法非善法破之論此申言無法可得意而示以菩提相亦當空也無少法是無上心是真如體平等是正等心是真如相以無我修善法是正覺心是真如用佛答有三初以覺性空寂言次以平等覺相言三以修法覺用言總是接引後生之意如來不留一法乃通萬法雖無少法不可以無法而入於斷滅雖平等不可以平等而據為真常修一切善法是指出下手工夫當以無四相為了因修六度為緣因也但既云無法又云平等修善法既云修善法又言即非善法步步回顧無相法不失無實無虗之旨總是欲人依法悟性又要離法見真耳講須菩提聞無法可說之義恍然有得白佛言世尊今佛得無上菩提於法殆所得耶佛深許其言曰如是如是我於無上正等正覺之法不從外得乃吾之真性也真性中蕩然空虗神凝智泯無有少法可得是名無上菩提佛再告須菩提曰是無上菩提法乃吾本然之性在聖不增在凡不減人人具足平等無有高下所以名為無上菩提何則以我真性中原無我人衆壽之妄人能根株拔盡又當修此明心見性之善法自覺覺他空明圓滿即得無上菩提須菩提我所言善法者乃接引衆生入道之門本來無此善法不過假此名以開悟人耳可知善法者真性也真性豈可以所得言哉須菩提若三千大千世界中所有諸須彌山王如是等七寶聚有人持用布施若人以此般若波羅蜜經乃至四句偈等受持讀誦為他人說於前福德百分不及一百千萬億分乃至算數譬喻所不能及石本無讀誦字千萬億分上無百字注前以恆河沙喻其多此以須彌山喻其大言七寶所聚之多有如此山之高大也論此第七番較量福德也因上言修善法恐人疑於般若外別有善法可修不知六度歸到離相可見圓滿法身不在清淨法身外所謂一切佛法皆從此經出不是虗語所以點出般若經名以見徹始徹終更無二理無上菩提總不出此般若經名此外別無善法也講佛告須菩提云三千大千世界中所有諸須彌山王可謂大且多矣設或以七寶之聚等如許山之多用以布施福德不為大乎然自性若迷福何可救若人以此般若經并四句偈受持而有得於心演說而有益於世則上成佛果下度衆生比七寶布施之福德不及此經百千萬億之一分也人可不持此經哉彚解自佛可以具足色身至此凡五節為一段亦申足上卷之義非具足掃盡從前色身相無說法掃盡從前說法相非衆生掃盡從前衆生相無少法非善法掃盡從前菩提相此全是般若慧光一空諸相其性智皆從此經得來所以點出般若經名以較量福德以見是經之宜奉持也須菩提於意云何汝等勿謂如來作是念我當度衆生須菩提莫作是念何以故實無有衆生如來度者若有衆生如來度者如來即有我人衆生壽者須菩提如來說有我者即非有我而凡夫之人以為有我須菩提凡夫者如來說即非凡夫是名凡夫古本俱無是名凡夫句注衆生指九種衆生言凡夫指人言前掃度生就菩薩言此就如來言論此再申言度生無度意而示以平等法界無我人之相也上半部言度生不居其功下半部言度生實無有法又言度生無我法只在菩薩身上說未曾在如來身上說佛恐人疑如來度生有護念付囑種種諸法不知如來無我則法本無法凡夫非凡夫則度而無度了結實無滅度之案以佛為菩薩作榜樣也蓋如來無我誰度衆生凡夫非凡夫有何衆生可度然則菩提平等度衆生亦平等菩提無我人度衆生亦無我人也講佛告須菩提曰汝勿謂如來作是念我當有化度衆生之心汝莫作是念也何以故般若真性人人具足雖如來以法度之然度其所自有非益其所本無實無有衆生是如來度者若說衆生必是如來化度則如來便有我人衆壽之私矣如來既無四相何說法時有時稱我當知如來說有我者乃對凡夫而言所說有我即非有我而凡夫之人以為能度惟我耳然佛此性凡夫亦此性須菩提凡夫者如來說即非凡夫蓋凡夫能悟自性便是如來不過虗名為凡夫而已所謂是法平等也須菩提於意云何可以三十二相觀如來不須菩提言如是如是以三十二相觀如來佛言須菩提若以三十二相觀如來者轉輪聖王即是如來須菩提白佛言世尊如我解佛所說義不應以三十二相觀如來爾時世尊而說偈言若以色見我以音聲求我是人行邪道不能見如來注觀與見不同見則從外而見之觀則有仰瞻之義轉輪聖王即四大天王如輪之轉管四天下察人間善惡者以業報福德亦具三十二相色即勝妙報身如來身相也音即名言文句如來說法相也我字雖指法身言即自性之我乃無為無相淨慧之體也邪道外道也如來者真常清淨之體如如不動者也不能見如來謂不能得見如如之真性也與上文見諸相非相即見如來同義論此申言不應取法相意而示以見如來不可著相也不可以相見如來空生屢答甚悉今反以如是為答何也蓋觀與見不同見是以相為佛也觀則以相雖非佛而相好原從無相中現出因有相以觀無相之妙亦未嘗不可但非佛發問之意若令初發心人聞之未免誤入邪道故佛攔頭截之我字雖指法身即可見衆生身中各有自性清淨真常無相之體學佛者當求諸心外此求佛即是邪道見乃衆生自見其心非見西方佛也此四句偈是經中一大關紐前之無我相四句於此結穴後之有為法四句於此關照即前不可以相見及即見如來等義俱歸結於此偈中集解四句偈有三無我相四句空心法之偈也若以色四句空身法之偈也有為法四句空世法之偈也附參講佛告須菩提曰汝之意果可以三十二相觀如來否須菩提若未喻其意反答曰如是如是欲觀如來者亦不出此三十二相也佛即曉之曰設若如來可以三十二相觀則轉輪聖王亦具色身莊嚴即可謂之如來矣須菩提隨應聲曰以我解佛之義不應以三十二相觀如來彼時世尊說偈曰法身靈覺含真妙體湛寂離彼形迹之間超諸耳目之外若徒以顏色覩其形容以聲教聽其謦咳欲求見我之真性此泥於色身佛皆捨正路而行邪道不能見如來矣須菩提汝若作是念如來不以具足相故得阿耨多羅三藐三菩提須菩提莫作是念如來不以具足相故得阿耨多羅三藐三菩提須菩提汝若作是念發阿耨多羅三藐三菩提心者說諸法斷滅莫作是念何以故發阿耨多羅三藐三菩提心者於法不說斷滅相別本第三句如來以具足相故無不字注諸法斷滅謂一切法皆斷滅之而無用也於法不說斷滅相謂修行人必依般若之法以為修行之具也斷滅則無相矣而亦謂之相者以其執著也此分四段前兩段若作是念莫作是念雙提言毀相之不可也後兩段即明其故言毀相之所以不可也考六祖注本此章第三句如來以具足相故並無不字又別本不以作可以照此則上半章一反詰一正說與下半文法一例且與無斷滅相反正相足意義較為醒豁附志於此論此申言不應取非法相意而示以得菩提不可滅相也經中前後俱以無相無得無說無法為宗非此攔截定成執空矣不知佛止教人離相不教人毀相只怕人著相非教人滅相上以離相無我顯般若空相不墮常見此以即相修因顯般若實相不墮斷見倘執著無相沈空棄有一切法皆斷滅不用反成槁木死灰矣故佛以此破之得此一段總攝空假結歸中道不但無實無虗之兩言於此暢發旨趣亦且即非是名之義理於此洗刷精神講佛呼須菩提曰汝若作是念說如來不用具足之相得此無上菩提汝莫作是念說如來修成妙相不關佛果遽然得此無上菩提也所以不可作是念者何也蓋發大乘正覺心者不著於有亦不墮於空汝若作是念謂發菩提心者說一切法皆當斷滅是以空寂視如來汝莫作是念也何以故發菩提心者必依般若之法以為修行之具於一切法不說斷滅也著相固不可而可滅相乎哉須菩提若菩薩以滿恆河沙等世界七寶持用布施若復有人知一切法無我得成於忍此菩薩勝前菩薩所得功德何以故須菩提以諸菩薩不受福德故須菩提白佛言世尊云何菩薩不受福德須菩提菩薩所作福德不應貪著是故說不受福德注無我者離相發心般若是也得成者超凡入聖波羅蜜是也忍者堅固強忍金剛是也前番言福德只說般若波羅蜜經此則申明金剛二字之義不受只是心淨言菩薩修福德不起貪著心非不修福德也論此第八番較量福德也前屢言持說四句偈等此獨指出成佛工夫來蓋前云通達無我法者是知所為法而未知其所以成也要之一切法無我得之必成於忍忍也者是成佛精進堅強之本領也作聖全功只此一句忍字與前信字相應不信則心無主宰不能入道不忍則心無把持不能成道如來說出信字為入道之門以忍字為守道之終不受福德正見空空如如之妙菩薩心同太虗所作功德惟為利益衆生使成正覺受與貪何處安著講佛呼須菩提曰若菩薩以滿恆沙等世界七寶持以布施福終有限若有人知一切法本無我相而以寂然不動耐久大力忍之又忍至於成佛而後已是大智慧大定力大涵養此豈不勝前布施之功德乎何以故以諸菩薩如如不動洞若太虗不受世間福德故也須菩提云菩薩濟度衆生原為希求福德今云不受何也佛云菩薩所作福德悉空諸相何嘗念利益幾事濟度幾人少有貪著之心所以說菩薩不受福德也彚解自勿謂如來作是念至此凡四節為一段又申足上卷之義先掃盡從前度生相無度生之我也次掃盡從前法相無常見之我也次掃盡從前非法相無斷見之我也法身法界悉無有我般若真性一片空明即以無我得成於忍句示以成佛功夫忍即金剛也是經名義於此盡揭末說到不受福德并福德相亦掃去較前更深一層須菩提若有人言如來若來若去若坐若臥是人不解我所說義何以故如來者無所從來亦無所去故名如來注三言如來皆指真性佛言去來坐臥不宜實看若字有相似之義去來者應現化身無去來者真性法身也論此申言如來二字之義而示以真佛無相也初取諸法如義釋如來則法法皆如頭頭是佛此取無所來去釋如來則指本原自性真如法身佛蓋真性如如充滿法身本無去來其來也心淨見佛非是佛來其去也心垢不見亦非佛去譬如水清月現月本非來水濁月隱月亦非去但水有清濁非月有升沈可知人心有垢淨佛本無去來也講佛呼須菩提曰若有人說如來者或來而感應或去而入寂或坐而跏趺或臥而偃息以此四威儀遂指為如來則著於有相徒睹其形容未窺其精蘊此人不解我所說無相之義也何以故蓋如來者即真性佛也真性無相本不生滅其來也遍虗空盡法界要之諸法空寂本來無有何所從而來也其去也等觀自在妙寂無為要之萬象全彰一真常在無所從而去也如而不去來而不來故名如來豈可以威儀顯現之象體認如來哉須菩提若善男子善女人以三千大千世界碎為微塵於意云何是微塵衆寧為多不須菩提言甚多世尊何以故若是微塵衆實有者佛則不說是微塵衆所以者何佛說微塵衆即非微塵衆是名微塵衆世尊如來所說三千大千世界即非世界是名世界何以故若世界實有者即是一合相如來說一合相即非一合相是名一合相須菩提一合相者則是不可說但凡夫之人貪著其事注碎即虗空粉碎之說微塵衆即至碎之義言人心妄念紛起煩惱無窮也世界總是衆生心識所成也兩實有語氣不同上是辨實有之理下言執有者之謬一合相王日休以為真性六祖以為根塵交合竊謂一字對上衆字言合字對上碎字言衆碎言其極細一合言其極大如來說碎界為塵空生却說合塵為界碎界為塵塵中盡是妄念合塵為界界中亦皆幻境看來四大本是假合此身和合為相實同幻化四大各離妄身安在所謂一合相即非一合相也不可說者言虗妄不可說人生如朝露佛固不欲作此語也事指六塵言凡夫貪著迷情執妄不悟塵界本空也論此中言微塵世界意而示以虗妄之相不可貪著也微塵在世界中游氣飄揚任其起滅世界在太虗中山河大地任其聚散猶如人生煩惱塵心皆逐妄而生故沈淪六道無可脫離般若性中照見微塵之多世界之大總歸於一空惟有法身常住不滅而凡夫昧於真性貪著眼前認幻緣為實境比如海中蜃樓帝王人物宮殿樹木種種顯現飛鳥望見認以為實遄往投之踏空而墮貪著誤之也講佛曰若有善男女以三千大千世界碎為微塵爾意是微塵衆寧為多不須菩提言甚多何以故此微塵衆俱是人心妄想安立若真個有此微塵衆佛則不說是微塵衆也唯此妄心皆是外來之物非吾心之所本有者若能心鏡常明微塵雖多豈足障蔽我哉此非微塵衆是名微塵衆也如來所說三千大千世界皆由妄塵積聚而成劫數盡時亦有變壞此所以虗幻不實即非世界是名世界也何以故若以世界為實有者凝合塵衆成一世界之相即是一合相然和合為相有成即有壞有生即有滅皆屬虗妄如來所說一合相即非一合相乃強名為一合相而已佛見須菩提已悟其旨乃謂之曰一合相者此則不可說也但凡夫貪戀執著於世間一切事認微塵為實有而妄緣競起觀世界為實有而幻境愈增非具金剛慧何能嶄然割斷一空此妄緣乎須菩提若人言佛說我見人見衆生見壽者見須菩提於意云何是人解我所說義不不也世尊是人不解如來所說義何以故世尊說我見人見衆生見壽者見即非我見人見衆生見壽者見是名我見人見衆生見壽者見須菩提發阿耨多羅三藐三菩提心者於一切法應如是知如是見如是信解不生法相須菩提所言法相者如來說即非法相是名法相注見與相不同見猶未成相有見而後有相見在相前一層相者法所現也見者心所取也相粗而見精四相乃經中所遣之執而四相又成於四見蓋至見歸真見而相亦無相矣如來真性中無此四見故云即非對有我說無我其名假立故云是名如是指上須菩提之三疊言此近脈也如來說應如是住如是降伏其心今結云如是知見信解此之謂住不生法相此之謂降伏此遠脈也壽者見上破我相發菩提下破法相經中屢言無相於此作一大歸結矣論此申言無四相并無法相意收拾一部經文也前言菩薩無四相衆生無四相如來無四相盡乎人矣言一切法無四相盡乎法矣此言佛說無四見蓋合人說法三者盡而無相之義始全於是復標發菩提心者以結前問應如是知通達無我法知一切法無我是也如是見不以色相見如來以行正道見如來是也如是信解聞章句則信說是法則信種種解所說義是也不生法相離一切相是也一切修持俱攝成此心無兩生不生法相則生如是心矣又言法相即非法相以結實無有法發菩提心之意講佛告須菩提曰若人言我曾說我人衆壽四見是解我所說義否須菩提曰佛之所說是人多不解其義何以故世尊所說我人等四見滯於形迹之私流為物化之纍所見皆虗妄也若真性中般若之妙如大明當空洞達無礙即非我人衆壽之妄見但虗名為我人衆壽見耳佛曰須菩提若能發無上菩提之真心者於一切事不起四見識自本心見自本性應如是真知如是真見如是信受解悟則無上菩提渾然具吾天真內凡在外有形迹之事皆不生於心矣然菩提心不離一切不即一切因物而付不滯於物即非法相是假名為法相而已須菩提若有人以滿無量阿僧祇世界七寶持用布施若有善男子善女人發菩提心者持於此經乃至四句偈等受持讀誦為人演說其福勝彼云何為人演說不取於相如如不動何以故一切有為法如夢幻泡影如露亦如電應作如是觀菩提或作菩薩注阿僧祇華言無央數無量阿僧祇世界不止恆河沙矣持於此經謂當持此所發之心以印於經示發心者以陀羅尼門也若作持經解則受持讀誦緊接在下豈宜重疊言之受持法前已詳盡演說法未曾闡明故有云何演說一證正是付囑處如者自如之謂如如則自如之甚不動正明其所謂如如言不變其本體也取相即非如如即是動如如二字上根不取於相來下接不動二字去乃形容性體之詞不必分疏合說方見其妙有為法凡世間有所作為之法即一切相也六喻皆非真實夢中境幻中花水成泡影隨形草頭露電光火均無實體變現靡常凡天地間有形有氣皆為非實應同六者觀之偈言末句雖承上三句說其意包涵甚廣論此第九番較量福德而因示以說法之軌則觀法之妙智為全經結局也此經雖是文字般若即可悟實相般若蓋真如之體聖凡俱足相法皆空惟適如其如本性湛定一無動搖猶如一月澄空千潭現影影有現滅月實自如以其無相無住故能普現一切不取於相如如不動八字乃全經之歸宿般若之宗旨經中反覆翻剝只完箇不取於相而已由淺入深層層剔發只求到如如不動而已然人之修道必從空世法始看世法不空必不能於真如著力六如乃大般若真空妙觀也此六字中凡人事之感應世運之遷流天地之變化都已說盡六喻觀成則真空自現菩薩得道得果全是觀門純熟觀即般若妙智照五蘊空是為深般若也修行人宜從此入法身真境故以觀字結經講佛終呼須菩提曰若有人滿無量無央數之世界七寶布施固得世間福矣若有善男女發菩提普濟之心於此經偈不徒受持自己見性又演說於人教人見性此出世間之福豈不勝彼乎哉云何與人演說蓋我真性本無上菩提之妙心為無餘涅槃之實理人法雙泯情智俱忘自無形迹之可求亦無聲色之可見不著於我人衆生壽者也不住於聲聲香味觸法也本來真空何有相之可取惟見如如焉一神通乎法界而定自真萬化妙於無方而體常寂自如之極一無變動而已何以故蓋真空無相本自如如一切賢聖法皆以無為法而親證之若世間有所作為之事皆虗妄不實如夢境之非真如幻術之假化如水泡之虗浮如身影之恍惚如朝露之易晞如閃電之易滅當作如是觀看可見世間之事諸行無常有生還有滅非真有也惟我如如不動之性湛若太虗超萬劫而常存歷千古而不變其福德豈有限量哉彚解自如來若來若去至此凡四節為一段亦申足上卷之義如來無來無去一真常住無相者也凡夫滿界滿塵虗妄為實著相者也惟能空我見破法相人法雙絶知見皆真乃為般若極則結以不取於相如如不動二句為全部金經結穴直指般若本體是修持法是演說法是住降法是滅度法即所謂無所住而生其心也即所謂無為法也一切有為法作六如觀則以空世法證入空心法尤為修行人第一喫要關頭佛之傳心俱在於此以之到彼岸證菩提不難矣是為經之下卷佛說是經已長老須菩提及諸比邱比邱尼優婆塞優婆夷一切世間天人阿修羅聞佛所說皆大歡喜信受奉行注比邱男僧也比邱尼女僧也優婆塞居士也優婆夷道姑也天人阿修羅六道中之三道也聞佛所說具聞慧也皆大歡喜妙契本心具思慧也信受奉行解行發心具修慧也論此阿難尊者贊記之語乃結經常儀也通篇最重一信字須菩提三問信心佛言於此章句能生信心一念生淨信得聞是經不驚不怖不畏信心不逆如是信解其最嚴重者則曰信心清淨即生實相實相者般若也至此煞出信受奉行四字聆佛所說頓悟二空直超佛地矣足見此經能度大衆入大乘證大果人因法悟法藉人宏要在人起淨信耳講佛既大闡般若之法說經已畢啓請之長老須菩提已領心印矣其同會聽法有出家修道之比邱比邱尼焉有在家修道之優婆塞優婆夷焉一切世間之人天上之人并阿修羅之神聞佛此經各言下見性幸正法之難遇欣今日之躬逢莫不淨信承受遵奉持行雖億萬劫來永證金剛不壞身也發菩提心者不奉持般若何由到彼岸哉總解金剛一經佛祖傳心祕旨也大要以清淨為體以發心為用以不著四相不住六塵為了空以平等修善法為功夫以無我得成於忍為實詣以如如不動為究竟以六如為觀智而全經起修則必以信心為入門至於六度四果五眼三心尤為竅要佛每遇緊要關節處便較量福勝讚嘆流通直至於今金剛智眼放光動地諸佛列祖以此傳法印心六道衆生因之滅罪證果皆由如來與空生一番問答發啓此段大事因緣所以得聞此經也佛之慈悲深矣持是經者其報佛恩哉
