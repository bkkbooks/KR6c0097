body:
  text: 注金中之剛至堅至利金取不變為義喻般若之體所謂實相般若也心本無相以如來真性為實相即自性清淨也剛取斷截為義喻般若之用所謂觀照般若也心本有覺以真智現前為觀照即本覺妙慧也梵語般若華言智慧智為慧體慧為智用梵語波羅蜜華言到彼岸此岸者衆生作業受苦生死輪回之地彼岸者諸佛菩薩究竟超脫清淨安樂之所能有智慧離一切相心常清淨即登彼岸所謂涅槃是也經徑也超凡入聖之徑路也總之金剛喻也般若法也波羅蜜證果也是本為姚秦三藏法師鳩摩羅什所譯流傳最廣論此標經題也波羅蜜有六布施度慳貪持戒度淫邪忍辱度嗔恚精進度懈退禪定度散亂智慧度愚癡惟一般若能生八萬四千智慧則六度兼賅萬行俱備衆生妄念紛紜姦偽百出自謂乖巧不知沈淪苦海永墮輪回真愚癡人也佛説是經欲人以淨心妙慧斬斷妄緣心性光明同登覺岸植善根者始而誦經終而悟理得堅固力金剛是也具大智慧般若是也度生死海登菩提岸波羅蜜是也五祖大師嘗勸僧俗但持金剛經即自能見性必至成佛如是我聞一時佛在舍衛國祇樹給孤獨園與大比邱衆千二百五十人俱爾時世尊食時著衣持鉢入舍衛大城乞食於其城中次第乞已還至本處飯食訖收衣鉢洗足已敷座而坐注如是指全經而言我阿難自謂也言此經所云乃我親聞於佛也一時説經之時也佛是釋迦牟尼佛者梵音華言覺也自覺覺他覺行圓滿故曰佛舍衛國波斯匿王所居祇陀王之太子也樹是祇陀手植故曰祇樹給孤獨園者王之宰臣須達拿賑濟貧人稱給孤獨長者須達拏深重佛教向祇陀借園同建精舍請佛説法故佛常住園中比邱華言乞士上乞法於諸佛下乞食於善信之謂大比邱謂得道之深者俱同處也按佛成道時先度憍陳如等五人次度迦葉兄弟三人并徒衆千人次度舍利弗及目犍連各弟子百人次度耶舍長者子等五十人應是千二百五十五人經第舉大數也佛為三界所尊故稱世尊諸天神旦食諸鬼夕食諸佛日中食食時午時也衣即三十五條大衣制象水田鉢即紺琉璃鉢佛行跣足故洗之敷布也佛每説法必布坐具也論此序説法因由也佛是金輪王子誰無供養之者而猶行乞欲歷頭陀苦行示同凡僧亦使後世緇徒不殖資産去彼貪心折其驕亢以煉種性也佛法要有三曰戒定慧乞食是戒趺坐是定戒能資定定能發慧故以戒定起般若正宗講阿難説我嘗聞佛在舍衛國祇樹給孤獨長者園中座下乞士共千二百五十人時方正午當進食之時佛乃著僧伽之衣持四天王所獻之鉢自外而入舍衛城中次第乞食不越貧先富不捨賤從貴平等無相一槩而乞還至園中飯食已完將入禪定於是收衣鉢屏資緣也洗足淨身業也敷座攝動歸靜也而説法之原起矣時長老須菩提在大衆中即從坐起偏袒右肩右膝著地合掌恭敬而白佛言希有世尊如來善護念諸菩薩善付囑諸菩薩世尊善男子善女人發阿耨多羅三藐三菩提心應云何住云何降伏其心佛言善哉善哉須菩提如汝所説如來善護念諸菩薩善付囑諸菩薩汝今諦聽當為汝説善男子善女人發阿耨多羅三藐三菩提心應如是住如是降伏其心唯然世尊願樂欲聞應云何住與後文云何應住不同蓋前問功夫下手後問有法示人也經意自別注時即食畢安坐時長老高年有德之稱須菩提解空第一在十大弟子之列全空之性真是菩提故名須菩提空性出生萬法又名空生空性隨緣應現利人利物亦名善現左為邪右為正示去邪歸正之義袒肩全身擔荷也膝地屈己順承也合掌心合於道道合於心也皆修敬之儀希有讚佛之詞如來佛之通稱如者真性之本體來者真性之應用即寂然不動感而遂通之義護者防其偏邪念者護之切付者傳以正道囑者付之殷菩薩華言覺有情謂能自覺又能覺悟有情也指凡學於如來者言如來善護二句引起全經以後凡佛所言皆是護念付囑也既云護囑菩薩又以善男女為問以衆生俱可證菩薩也阿無也耨多羅上也三正也藐等也菩提覺也皆梵語也無上正等正覺心即是佛心人之真性也真性包含太虗無得而上之故云無上然佛與凡夫性相平等故云正等其圓明普照無偏無虧故云正覺發此心者乃發吾當下具足之菩提心也住止也是靜存本位降伏是妄念突起力為制伏也上下兩心字相應菩提心乃最初之真心也其心是顛倒之妄心也諦詳審也兩如是謂既發無上菩提心即應如其所發之覺心而安住降伏也二句自應一串説下唯領諾也然是其言也願是誠心樂是鼓舞心欲是迫切心如此始能諦聽故繼以涕泣終以歡喜論此善現啓請安住降伏之旨開萬世教門心法也發阿耨多羅三藐三菩提心句經中凡二十九見為全經之綱一點菩提心是金剛正眼萬法總持菩提心一發智光便現名為般若一切萬行從此而生所以學佛人初從淨信直至成佛總離不得發菩提心也如來説箇如是二字見得此心發處即是住處般若慧光觀照自心見性即無妄念無妄念即是降伏但此處尚未説明至下文無相無住方證修因講當佛敷坐之時有長老名須菩提者乘機發心願佛化度衆生因起而請曰希有哉世尊也如來起慈悲心善能護持眷念衆菩薩使之信受善能以佛法付委囑託衆菩薩使之奉行矣若有善男女學道之初先發此無上菩提之佛心當如何常住而使之不退轉妄心若起當如何降伏而使不惑亂我真心乎佛言善哉善哉汝云如來善教諸菩薩此言正合我心汝其詳審諦聽吾當為汝説夫人之一心朋從往來攻取日衆最難發此菩提覺心若既發此一念則滿腔中純是天理真如本性自然顯露應如是常住而不遷如是一切妄心不待驅除自能降伏矣須菩提領悟其言曰世尊弟子願聞佛之教佛告須菩提諸菩薩摩訶薩應如是降伏其心所有一切衆生之類若卵生若胎生若濕生若化生若有色若無色若有想若無想若非有想非無想我皆令入無餘涅槃而滅度之如是滅度無量無數無邊衆生實無衆生得滅度者何以故須菩提若菩薩有我相人相衆生相壽者相即非菩薩別本非無想上有若字舊本經中凡即通作則因避高麗諱稷改即為則凡兩合之義為即相仍之義為則即可用之相仍則不可用之合兩今從之注摩訶大也謂心量廣大也未發心稱善人已發心稱菩薩一切衆生該下九種而言卵生禽鳥也胎生人與獸也濕生水族也化生蠅蚊類也此四種是欲界受生差別也有色但有色身而無情欲也無色但其靈識而無色身也有想方寸之中尚有計慮也無想淨涵萬有一念不動也非有想非無想雖一念不動不似木石之無知也此五種是心念差別也衆生在五蘊中受生真性既迷則墮於胎卵濕化虗空等神天魔等鬼所以輪回六道難入涅槃六祖俱指心説蓋剖示其受生轉變之所以然非謂人心如此即謂之胎卵濕化也我者代度生菩薩設為自任之詞非佛自謂也令者指九種言煩惱俱盡為無餘不生為涅不死為槃是圓滿清淨能所全消超脫輪回出離生死究竟到彼岸地位誤認為死則大謬矣滅消滅滅盡癡愚煩惱度化度度脫生死苦海衆生皆有夙業遇佛而後得果是謂令入無餘涅槃而滅度也相形迹也我相自私自利止便身圖也人相痛癢無關分形絶界也衆生相區別靈蠢品類以分也壽者相畏死幸生希冀不老也無衆生得滅度即是無四相正降伏之要也論此答降伏之問而教以度生不著四相也尊者首請應住次問降伏而世尊先酬次問者以菩薩所發大心為度生之心故以度生開示之蓋菩提心即天地之心必度盡衆生方完得本來分願所以衆生受生不同佛皆導之覺悟本心入於一真法界而使業緣盡滅度脫輪回實以衆生性中自具般若各完本性便為滅度即使度盡衆生不過還其本然而已所謂實無滅度也度生無度即是無相無相便是降伏四相經內頻呼疊喚此最淨染關頭教人加意蕩滌方是無上正等覺也圓覺經云未除四種相不得成菩提講佛告曰須菩提諸菩薩性量廣大應如是降伏其心果何道以致之蓋我之心即人物之心所有一切衆生之類若世間之卵生胎生濕生化生天上之有色無色有想無想非有想非無想皆是衆生妄心結習所致我皆令其超越生死滅其業障而度脫之如是滅度無量無數無邊之衆生者豈我真能滅度哉以衆生原有佛性只是迷而不悟今心地開朗頓見本性是自性自度於我何功焉所以度而無度者何惟無四相故也若見有度人之我則有我相見有所度之人則有人相見我所滅度無量無邊則有衆生相見我與衆生同到涅槃則有壽者相有此四相即非三輪體空之菩薩矣復次須菩提菩薩於法應無所住行於布施所謂不住色布施不住聲香味觸法布施須菩提菩薩應如是布施不住於相何以故若菩薩不住相布施其福德不可思量須菩提於意云何東方虗空可思量不不也世尊須菩提南西北方四維上下虗空可思量不不也世尊須菩提菩薩無住相布施福德亦復如是不可思量須菩提菩薩但應如所教住注復次還與須菩提言也法字總六度萬行諸法所該甚廣下文六塵從法中抽出來以六塵為日用切要也此住字作執著解六度以布施為首此布施主法施言此經句句是般若法施菩薩心施與財寶施身命施不同觀行於布施行字非是斷滅眼耳鼻舌身意為六根色聲香味觸法為六塵觸身所感觸也諸法皆緣心生故屬意不住相者指不住六塵之相言菩薩化度衆生教以清淨六根不染六塵可以證解脫乃法施也應如是布施句承上復一句引起下文福德即福慧不住相布施則心境如如有自然之福德非福報之謂也東西南北四維上下謂之十方總是一個大字虗空者太虗之中蕩然空朗也是喻不可思量以顯無相福德之妙末住字作止住義解如來教菩薩法不過住無所住菩薩受如來教但當如其所教以無住為住也論此答應住之問而教以布施不住塵相也菩薩發心度生為事菩薩六度布施居先故度生布施皆為降住中事上言滅度衆生不著四相然要離四相必先不住六塵蓋菩薩心量遍該法界布施一切利益衆生必使盡證解脫然後此心無歉但一涉交接事物相纏最易粘著須養得此心一邊不著方其體之虗如明月當空及其應之靈如流水曲注以菩提妙心行菩提大用不著六塵無所貪著意境盡化迹象胥融地闊天空其福德乃無限量佛法廣大與天地參福德不可思量並非虗語按此言無住相行施之福德雖無較量意然為下九番言福德總攝後文即緣此為較量也準此問答便已經終蓋大乘正宗經文於此已備下特以四句偈綜括經旨耳講佛因無相之義再告須菩提曰菩薩於六度萬行之法當空此心無所執著以為敷布設施何則六塵一有所著便不能空此心以施於衆生菩薩舍其所貪歸於空寂不於六塵上有所係纍但自性虗通妙圓明淨隨感而應不住於相也何以故若菩薩不住相布施則所有善根純熟圓滿永得無上菩提之道其福德豈可限量哉吾試問爾如十方虗空可思量不須菩提言大莫大於虗空非人之所能測度也佛言無住相布施之福德亦如虗空之不可思量須菩提汝學佛之菩薩但當如我所教無住相布施之理以住其心可也須菩提於意云何可以身相見如來不不也世尊不可以身相得見如來何以故如來所説身相即非身相佛告須菩提凡所有相皆是虗妄若見諸相非相即見如來注身相謂佛應身三十二相也見如來指法身言謂真性佛也如來所説之如來乃是佛號凡所有相指一切物相而言凡四相法相非法相皆在其中兼空有兩層即見如來見衆生本性之如來即菩提心也論此言有相皆妄而顯無相之真佛也上文説箇不住相尚未説出所以不當住相之故至此説凡所有相皆是虗妄虗妄豈可住著若見諸相非相此無相處即如來法身也此經是破相宗無相是真佛乃從源頭上破見非相不落於有見相非相不滯於無即妄即真即有即空原無二體得見真空實相故曰即見如來此第一義諦大乘之真見也按唐圭峯以凡所有相四句為經中之四句偈持論甚正蓋此四句為大乘正宗包括全經之旨下經若以色見我四句即此見相非相二句如夢幻泡影四句即此凡所有相二句講佛恐須菩提聞無相之旨所悟尚未盡徹故舉身相徵詰之曰須菩提可執四大色身謂如來在是否須菩提言不也不可以身相得見如來蓋如來所説身相不過形體之末非真空無相之道也佛於是曉之曰世間凡有形相可見者皆是假合變幻不是本有真實之理雖有所見亦妄見也若見諸相便識破非我真實本相自能回光返照即見色身中有法身自性之如來隨處顯現矣如來豈可外求耶彚解自善現啓請至此凡四節為一段全經以無相為宗而此特為無相之總綱統為大乘正宗前示離相度生以彰妙慧無相行施以稱妙福非相見佛以印妙心總之相皆虗妄能見本性真空實相即見真佛末揭出破相宗之四句偈已將全經大旨都行包括故下文隨接如是言説章句作一兜裹以後反覆開導皆是申明無相之義須菩提白佛言世尊頗有衆生得聞如是言説章句生實信不佛告須菩提莫作是説如來滅後後五百歲有持戒修福者於此章句能生信心以此為實當知是人不於一佛二佛三四五佛而種善根已於無量千萬佛所種諸善根聞是章句乃至一念生淨信者須菩提如來悉知悉見是諸衆生得如是無量福德何以故是諸衆生無復我相人相衆生相壽者相無法相亦無非法相何以故是諸衆生若心取相則為著我人衆生壽者若取法相即著我人衆生壽者何以故三字盛釋及各正本俱定為衍文若取非法相即著我人衆生壽者是故不應取法不應取非法以是義故如來常説汝等比邱知我説法如筏喻者法尚應捨何況非法注如是言説章句指上數章而言信為入道之門實信者信此章句為真實之諦也佛滅度後正法五百年像法一千年末法三千年後五百歲正末法時也持戒諸惡莫作修福衆善奉行信心慧心也能生者戒定既具智慧自生也善根即菩提心種有生發義所猶處也一念專念也上云實信以佛語為實而信之此云淨信心常清淨不生妄念也悉知悉見心合於佛佛合於心也福德清淨中自具福德也法相以法為有也非法相以法為無也無四相則人空無法相則法空無非法相則空亦空有無雙遣方是真空取即著也反言之以明法相非法相之不可有也如來常説云者蓋古佛有是語而復述之也筏船也喻譬也言譬如以筏渡人既濟而筏無用也論此因須菩提問實信恐菩薩於四相之外別生法執必并法與非法之相皆空方可言淨信也佛法大海信為善入善現聞佛説法實深信受又欲衆生同生信心共登覺路故有是問然開口説言説章句即存一法相於胸中佛先教學者能生信心以此為實又恐學者徒泥言説不求心得故云無法相又恐學者執著無法入於沈空斷滅不去探討其言以悟真理故復下轉語曰亦無非法相且申其誡曰法尚應捨何況非法兩頭截住乃為淨信也淨信是衆生可以成佛作祖之善根三是諸衆生句諄諄提命直欲喚醒羣夢講須菩提聞大乘正宗之教恐後來衆生未能生信乃白佛曰世尊所説菩薩未有不尊奉矣倘末世凡夫得聞如是言説章句果能生實信否佛曰汝莫作是説蓋此無相真空之理必有大根基之人方能信任其道設或佛滅後至五百歲之遙有人持守戒律廣修福田能於此章句確信為實者此人必從諸佛同源之所斷除惡業栽植善根者也若有此善根之人聞得此經章句乃至一念之中心常清淨篤信不疑此心便與如來相合佛智佛慧無不知其存心見其行事是諸衆生當得無量清淨福德此何故哉是諸衆生悟得真空無相之理無復有我人衆壽四相是人空也四相既空諸法無從得立故不執有而為法相亦不執無而為非法相是法空也此何以故是諸衆生苟心不空淨便著我人衆壽之形迹此人所易曉也至於我説無法相者以吾真如本體不在語言文字之間若取法相與執著四相一般若取非法相又涉斷滅見與前著四相又何異焉是故不應取法相而以為有亦不應取非法相而以為無則性體之中渾然形迹兩忘矣以此義亦有原故佛嘗謂汝學道之人當知我説此法者因汝不能了悟真空超於彼岸我不過假此法度脫生死苦海汝既自見本性證涅槃樂則我之法當無所用矣譬如以筏渡人既得登岸筏即無用由此觀之有法尚應捨矣何況非法又可執著於無沈空守寂哉須菩提於意云何如來得阿耨多羅三藐三菩提耶如來有所説法耶須菩提言如我解佛所説義無有定法名阿耨多羅三藐三菩提亦無有定法如來可説何以故如來所説法皆不可取不可説非法非非法所以者何一切賢聖皆以無為法而有差別注得謂得於己也説謂教之人也義字頂上章以是義故來即指不應取法取非法説無有定者不偏有不偏無兼法與非法言然善現爾時尚未了一切法即非一切法故不直曰無有法而曰無有定法不可取謂不可以色相取不可説謂不可以口舌説非法者雖有而却無非非法者雖無而却有賢者若四果之類聖者佛也以字作用字解無為法乃清淨覺性不假人為者也即是無住即是無相即是無上菩提長老先言無定次言無為悟入聖境矣論此承上不可取法取非法而明無得無説之真法也前文説個若見諸相非相即見如來此兩句該得全經意旨但見如來處落在實相上則成法相落在非相上則成非法相所以前節將法與非法兩路截清此却將如來所得所説徵詰者兩個如來字正根上見如來字來要勘他信處落在那裏空生答以無有定法不可取説活潑潑地恰在箇中末後説出無為法而有差別不是腳踏實地怎能説得如此諦當只此一語為衆生説可以出生死趨菩提故下文遂以持經功德較量也講前既説法相非法相佛恐須菩提尚未透徹故問曰汝以如來無上菩提之法果有得於己耶抑以此法有所説而教之人耶須菩提言如我心中悟佛所説義則知無上菩提之法此吾本來真空未嘗指定一法名為無上菩提也即佛所説不周隨機設教何嘗指定一法教人必如是而後修哉此何以故如來所説無上菩提法可以性修不可以相取可以心傳不可以言説若執為有法而吾性虗靈莫測非有法也若執為無法而吾性隨感即應又非非法也蓋無上菩提之法皆我自然覺性無假人為故一切賢聖皆同此無為法聖人具足清淨故名為聖菩薩自聲教而悟故成為賢所證有差別爾須菩提於意云何若人滿三千大千世界七寶以用布施是人所得福德寧為多不須菩提言甚多世尊何以故是福德即非福德性是故如來説福德多佛言須菩提五字較訂補正若復有人於此經中受持乃至四句偈等為他人説其福勝彼何以故須菩提一切諸佛及諸佛阿耨多羅三藐三菩提法皆從此經出須菩提所謂佛法者即非佛法是名佛法四字較訂補正注三千大千統言大世界七寶金銀琉璃珊瑚瑪瑙珍珠玻璃也此布施作施捨看福德者修布施之德享現在之福也福德性者修性中之德慧光所照福分過人即真性也尊者領悟指出一性字來最為著眼信力曰受念力曰持發言成句為偈四句偈或指經中二偈或指無我相四句圭峰謂凡所有相四句最妙須知從經中受持説來必上有乃至字下有等字言於此經中受持一部一章乃至四句偈等有自多至少偈不一偈意豈可執四句以求著落乎菩提法謂諸佛求真性之法也何佛非心何佛法非心法此經為般若真諦故曰皆從此經出非單指經文語句言也佛法者真諦之理非佛法者不執法也是名佛法者非斷滅也論此第一番較量福德也福德前後九番較量義各有屬此佛恐人因不可取説住在無相無為處便欲毀棄言教言教若棄將何信解所以特指出無上菩提之法皆從文字般若中來人心具有佛性假文字般若而後得悟則此經即般若真性能生佛法又恐人在佛法上又生執著隨下轉語曰佛法即非佛法蓋佛法在心而不在教非佛法者無法相也是名佛法者亦無非法相也經中凡言即非是名三折筆處皆具此兩義佛每説經一番皆以布施較量福德一番佛蓋知末法劫中多以施捨當修行不解見性要旨所以諄切反覆言之耳講前言法無為矣佛恐人忽略般若章句故以持經功德較量因設問曰若有人充滿三千大千世界之七寶用以布施是人所得福德多否須菩提言甚多然是福德乃有相之施於我性真空無相妙法全不相關必竟非福德性故如來所言福德者乃人天小果之因此所以為多也佛言如再有人於此經中信受其言奉持其義乃至四句偈等更為他人解説則自覺覺他其福勝於七寶布施多矣蓋彼乃住相布施縱得濁福福盡墮落此乃因經悟性福等太虗歷劫不壞其福不遠勝哉此何故也蓋此經乃修行之徑路諸佛之身及所證之法皆從文字般若而生此外更無餘經矣夫無上菩提之法即佛法也然所謂佛法者本來無有不過使之言下見性乃虗名為佛法也彚解自須菩提問實信至此凡三節為一段無人無法衆生修行無相也無得無説如來説法無相也至須菩提説出無為二字般若正宗已是了然佛恐人將無為法認作枯寂住在這裏殊不知菩提一現萬法具足真性福德無量無邊正以此經即般若性成佛之道不外乎此佛教人因經悟性非徒誦説已也須菩提於意云何須陀洹能作是念我得須陀洹果不須菩提言不也世尊何以故須陀洹名為入流而無所入不入色聲香味觸法是名須陀洹須菩提於意云何斯陀含能作是念我得斯陀含果不須菩提言不也世尊何以故斯陀含名一往來而實無往來是名斯陀含須菩提於意云何阿那含能作是念我得阿那含果不須菩提言不也世尊何以故阿那含名為不來而實無不來是故名阿那含須菩提於意云何阿羅漢能作是念我得阿羅漢道不須菩提言不也世尊何以故實無有法名阿羅漢世尊若阿羅漢作是念我得阿羅漢道即為著我人衆生壽者世尊佛説我得無諍三昧人中最為第一是第一離欲阿羅漢世尊我不作是念我是離欲阿羅漢世尊我若作是念我得阿羅漢道世尊則不説須菩提是樂阿蘭那行者以須菩提實無所行而名須菩提是樂阿蘭那行佛告須菩提於意云何如來昔在然燈佛所於法有所得不不也世尊如來在然燈佛所於法實無所得今本是故名阿那含無故字注能作是念者謂曾萌得道之念也前四我字乃代四果人設想之詞佛氏有因有果能修是因即得是果須陀洹華言入流謂入聖人之流也無所入者不著入流之相也此聲聞初果自聲教而悟者曰聲聞斯陀含華言一往來謂一往天上一來人間便得涅槃六祖云前念起妄後念即止前念有著後念即離目覩諸境此心還有一生一滅無第二生滅故言一往來實無往來者無往來之相也此聲聞第二果比入流高一級阿那含華言不來謂直生四禪天上不來欲界受生也實無不來者不著不來之相也此聲聞第三果比尚有往來又高一級阿羅漢華言無生謂諸漏已盡無復煩惱不於三界內受生也阿羅漢得無相之理人法俱空已證涅槃此又高一級聲聞之道圓滿已極故不名果而名道實無有法者謂無煩惱可斷無貪嗔可離情無逆順境智俱忘無絲毫之法可取也無諍者蓋有欲則爭此既離欲何諍之有三昧華言正見謂本覺心也離欲斷盡見思煩惱也阿蘭那華言寂靜樂好也謂好清淨行也蓋佛嘗有是語而須菩提舉以為證也實無所行者謂本性空寂不著行相也佛説以下尊者自述其所造以證無相也以上言四果皆以無為法而不著得果之相下復以佛之無相證之如來釋迦牟尼也然燈佛即定光佛是釋迦牟尼之師實無所得者謂成佛由本心覺悟無有法可得也實字與上數實字相應論此歷徵一切賢聖修證處皆以無為法而不取於相也四果功夫自有等級每證一果隨證隨空初果云不入色聲香味觸法是知欲境當避如初生果二果云一往來是蹈欲境不再如方碩果三果云不來是去欲境如遺如已熟果四果云離欲是脫然無纖欲可除如既收果此是漸教如此若是無上菩提頓悟真空即此金剛般若波羅蜜超入佛地矣又何四果之足云佛自謂成佛實無所得證四果之無所得言無相之理乃我自有之真性其成佛皆由我心自悟而得也於法無得原屬實相不是斷滅講須菩提言無為法已悟菩薩修行矣佛乃從賢聖無為中差別以詰之曰須陀洹曾作是念我必得此果否須菩提言不也須陀洹得預聖人之流名為入流而心無所得不著入流之相但未能頓悟真空僅能不入六塵境界耳名須陀洹其以是歟佛曰斯陀含曾作是念我必得此果否須菩提言不也斯陀含一往天上一來人間名一往來而心無所得不著往來之相蓋已悟真空究竟能出離生死不受輪轉也名斯陀含其以是歟佛曰阿那含曾作是念我必得此果否須菩提言不也阿那含不來世界受生名為不來而心無所得不著不來之相蓋本性光明真空無我內無欲心外無欲境也名阿那含其以是歟佛曰阿羅漢曾作是念我必得此道否須菩提言不也阿羅漢萬緣悉淨外如木石不動不搖心如止水不滲不漏性本真空實無一法可得也名阿羅漢其以是歟世尊若阿羅漢作得道之念即著我人衆壽四相矣所以佛曾説我一念不生與人無忤得無諍三昧弟子中最為第一必是我脫盡人欲斷絶此念方許我為離欲阿羅漢也我若作此念可以得阿羅漢道則又生妄念佛即不説我好寂靜之人矣以我須菩提外雖有行心中無一可得佛故名為樂阿蘭那行佛終恐其所得之心未除又從而默化之曰我當初在然燈佛處果得本師之法否須菩提言不也如來一心清淨雖在燃燈佛處不過因師開導實乃自悟自修於法實無所得也須菩提於意云何菩薩莊嚴佛土不不也世尊何以故莊嚴佛土者即非莊嚴是名莊嚴是故須菩提諸菩薩摩訶薩應如是生清淨心不應住色生心不應住聲香味觸法生心應無所住而生其心注莊嚴如建塔造寺設像供養之類一大世界必有一佛設化謂之佛土黃金為地七寶為林是莊嚴佛土也自性佛土本來具足不假莊嚴故云即非莊嚴心常清淨無嚴而嚴故云是名莊嚴應如是生清淨心指上非莊嚴説前云生淨信是一念之覺此生清淨心是全體之修六度萬行總為修此清淨是本來地即究竟地前不住色等布施此不住色等生心攝事歸心言不住較細且前云應無所住行於布施此云應無所住而生其心并不著布施之相清淨之不已處即是生也有所住而生心是濁亂心無所住而生心乃為清淨心生其心者又非稿木死灰入於頑空也無住生心句是全經大旨論此揭出安住降伏要旨教菩薩以清淨為莊嚴也菩薩修六度萬行佐揚佛化非不莊嚴佛土但不取外相莊嚴當知莊嚴是清淨心無住相心心無所住則絲毫不挂萬境澄徹即清淨也譬如一鏡當空無所不照何等清淨若先著一物則空明遮蔽焉能照物無所住是從實趨空生其心是從空生覺此心字是正智是真心但住著於境則隱而不現心若不住般若了然生其心者顯現本有真心非突然生起也此句是金剛正眼般若妙心昔六祖聞無所住而生其心句即大悟曰何期自性本自清淨何期自性本不生滅何期自性本自具足何期自性本無搖動何期自性能生萬法學者在祖師門下當從無住生心處體會微旨講前言佛無所得學佛諸菩薩安可徒事莊嚴佛土而不返求諸心哉故告須菩提曰菩薩居佛土之中果作善緣福業使佛土莊嚴否須菩提言不也佛所謂莊嚴者即非外貌相好之莊嚴必其心地明潔萬行具足是名莊嚴也佛於是順其詞而語之曰菩薩莊嚴既不在於外飾當返而求諸心使泰宇之中湛然常虗無一毫染濁靈臺之內寂然常定無一絲擾亂當如是生清淨心不當住在色聲香味觸法生心一有所住便不能清淨矣須知清淨心妙湛圓寂不泥方所本無所住也於無所住而生其心如明鏡當前物來悉照物去即空自然十分清淨是淨土莊嚴孰甚焉須菩提譬如有人身如須彌山王於意云何是身為大不須菩提言甚大世尊何以故佛説非身是名大身注須彌山之極大為衆山之王故云山王人身豈有是大不過假設之詞如七寶滿大千之類上言心此言身者非反説到身外也身字即作心字看非身謂法身即真心本性也非身名大身者即真心之無住足以包太虗藏沙界也論此承上文無住生心而言以見心量之廓周無盡也言心無所住則淨心常生法身圓滿此心最為廣大如來設大身為問尊者悟得無住真心遍滿法界妙含萬有量等虗空雖須彌不足喻其大問答至此乃見身土皆空心境雙絶不言福德而福德難量矣故下文遂較量福德講前言莊嚴佛土不如清淨此心矣又恐錯認色身為大不知心為大故設問曰須菩提譬如人身如須彌山王可以言大否須菩提以甚大答之何以故色身雖大為有生滅必竟不名大身佛説非身才是我之清淨本心此心包含太虗充滿法界無相無住頓入圓明乃真法身是名大身也須菩提如恆河中所有沙數如是沙等恆河於意云何是諸恆河沙寧為多不須菩提言甚多世尊但諸恆河尚多無數何況其沙須菩提我今實言告汝若有善男子善女人以七寶滿爾所恆河沙數三千大千世界以用布施得福多不須菩提言甚多世尊佛告須菩提若善男子善女人於此經中乃至受持四句偈等為他人説而此福德勝前福德注恆河西土天竺河周回四十里沙細如佛多在此説法故取為喻沙等恆河是倒裝文法謂恆河如沙之多也亦是假設之詞前只言三千大千世界此言如恆河沙數其大且多益不可量勝前者勝於布施之福也論此第二番較量福德也前第一番較量因前止説得人法俱空總歸於無為故言佛法皆從此經出以啓發之以下歷舉聲聞菩薩俱從無為法中現出許多差別結勸諸菩薩無住生心而託大身作喻以驗之則清淨法身中之全體大用一齊俱現矣此較量功德所以一步深一步也講前言無住生心則清淨之福不可量矣佛故即布施推廣其義曰須菩提恆河之沙固多矣設或不止一恆河數其如沙之多恆河是諸恆河中之沙多否須菩提言甚多但諸恆河且多而無數何況恆河中之沙乎佛謂須菩提若有善男子善女人以七寶滿恆河沙數三千大千世界布施得福多否須菩提又以甚多答之佛曰若有善男女於此經中受之而無疑持之而不失必見自己真如菩提本性矣又能以真空妙義為人解説使人心地開通明了自性可以脫離輪回永超生死則是人己兼成此其福德歷劫常存豈恆沙布施可及哉復次須菩提隨説是經乃至四句偈等當知此處一切世間天人阿修羅皆應供養如佛塔廟何況有人盡能受持讀誦須菩提當知是人成就最上第一希有之法若是經典所在之處即為有佛若尊重弟子注隨説與後盡能相應是隨舉經文之義此處即説經之地世間天人阿修羅謂天道人道及魔道也供養如香花瓔珞幢幡寶蓋之類塔藏佛舍利者廟樹佛形像者受者領會其意思慧也持者服膺弗失修慧也對本曰讀離本曰誦聞慧也未受持而誦讀領益猶淺既受持而讀誦取類乃深萬行修持俱攝在四字內能趨菩提名最上諸乘不及名第一世間所無名希有法即菩提法也必成就法然後能成就功德故下文遂言成就功德兩若字不是虗字乃深讚成就第一者之詞尊重弟子弟子中之可尊重者經典法寶也有佛佛寶也尊重弟子僧寶也經典所在之處即三寶共處也論上言持經功德之勝此申言其所以勝也前兩言獲福以受持與為他人説並提恐學人徒逐章句虗務福勝而於第一義諦未能思維修習則自己不能成就何能利益他人故歸重受持以示説法之本隨説者一節之般若也盡能者全體之般若也盡能受持讀誦者金剛深慧無一不入六字中有無量功行在經典在何處即在此心若盡能持誦之人自心誦得此經自心解得此經義自心體得無著無相之妙理念念精進常修佛行其智與理冥視經典所在即如有佛即上文見如來也歸依護持自視為尊重大乘弟子即下文荷擔如來也講上言持説是經福德之勝於何見哉佛再告須菩提曰若有人隨舉經文之義乃至四句偈等為之講説令聽者除迷妄心則説經之處自然感得世間天人阿修羅等皆來恭敬如藏身之塔供像之廟殷勤瞻禮矣夫隨説句偈尚能感天龍八部供養如此何況有人盡能以此全經受持而體驗於心讀誦而研窮其義則知是人以一心成就阿耨多羅三藐三菩提法真最上而無以加也第一而無可比也又絶無而僅有也若是經典在處即佛在處心常清淨得真如妙性非即佛門之高弟子歟彚解自佛言四果至此凡五節為一段佛以四果無念釋迦無得為無相證隨言莊嚴亦無相特為諸菩薩揭出應無所住而生其心句為作佛宗旨千聖心源在此一語又言無住生心之量最為廣大其福德之勝惟在持此經耳善現至此已領妙悟故下文直請經名及受持法爾時須菩提白佛言世尊當何名此經我等云何奉持佛告須菩提是經名為金剛般若波羅蜜以是名字汝當奉持所以者何須菩提佛説般若波羅蜜即非般若波羅蜜是名般若波羅蜜須菩提於意云何如來有所説法不須菩提白佛言世尊如來無所説古本無是名般若波羅蜜句注佛説皆經也初稱言説章句次稱法次稱經至此請立經名蓋欲知義趣須先識經名因請示名庶不使奉持無法也法名般若照見萬法皆空也法喻金剛專指一真不壞也佛將般若二字安名又加金剛二字以見至堅至利不與萬法為侶乃一切俱空一切具足即是到彼岸也一部真經都該在七字內奉持此名字即奉持全經不可更贅一語也法性本空無可執著故云即非中有真覺萬象光明故云是名又恐聞説經名不認自心徒認作法故復詰之而善現已於即非般若中悟無法可説也論此佛特示經名是一部金經點眼處也從前説降伏安住並未説出般若其間如度生破盡度相布施破盡施相見佛破盡身相淨信破盡法相如是堅固如是猛利全是般若之智慧如金剛之能斷蓋本心淨明真慧隨緣不變能摧斷一切煩惱而不為一切所摧是為金剛般若此經所説直指心體乃斬絶妄緣智慧到彼岸之法也然般若是人清淨心體上一點靈光離一切相即一切法盡大地無有一法是般若存住處亦無有一法不是般若放光處即非即是直使奉持者胸中不留一個字腳講善現聞第一希有之法已覩指知歸遂發心奉持請立經名白佛言世尊持説是經成就希有法矣不識此經當以何命名我等云何奉持乎佛曰是經當名為金剛般若波羅蜜蓋明是經者其智慧如金剛之堅利斷絶外妄直達諸佛菩薩之彼岸也以是名字汝其奉持之所以奉持者當何如佛説般若波羅蜜者妙覺本性湛若太虗體既尚無何名之有如來恐人方斷滅見不得已而虗名為般若波羅蜜也真性本來如此更有何法可説乎須菩提如來有所説法否善現知諸法原空即印證曰如來萬法皆空有何可説須菩提於意云何三千大千世界所有微塵是為多不須菩提言甚多世尊須菩提諸微塵如來説非微塵是名微塵如來説世界非世界是名世界注微塵者八萬四千塵勞也世界者衆生世界也三千大千世界所有微塵所謂衆生無邊煩惱無盡也能修般若無相無著之行了妄念塵勞即清淨法性故云即非微塵了妄即真真妄俱泯故云是名微塵性無塵勞即佛世界性有塵勞即衆生世界了諸妄念湛然空寂故云即非世界證得法身普見塵剎應用無方故云是名世界論此示塵界皆空以顯般若之用所謂觀照般若也若以塵界觀之則滿目萬象森然塵境若以非塵界觀之則一道虗間真空真寂所謂寂滅虗靈寄森羅而顯象縱橫幻境歸一性而融真蓋般若心光大包千界細入微塵則盡十方世界無非自己光明也佛謂文殊曰在世離世在塵離塵是究竟法即非塵非界意講佛告須菩提曰三千大千世界所有微塵果多乎否須菩提以甚多答之佛曰如來説諸微塵者原是幻妄之物而靈虗之府太空澄徹非微塵所可污故不是微塵乃假名為微塵也如來説世界者原不是我心中本有的而心地廓然淨無瑕穢便是出世間法非世界所得囿故不是世界乃虗名為世界也須菩提於意云何可以三十二相見如來不不也世尊不可以三十二相得見如來何以故如來説三十二相即是非相是名三十二相注三十二相莊嚴端好指全身而言此乃色身佛也見如來指法身言觀相原妄無可指陳不妨相即無相故曰即非身相觀性原真塵塵妙覺不妨無相即相故曰是名三十二相論此言非相即相以顯般若之體所謂實相般若也上言塵界非塵界是離幻歸空此言身相非身相是即空悟實三十二相只是色身如來當知別有一箇真性如來非色非空超然萬象之表無變無壞總歸一真之中故云是相即非相識得非相是名真相講佛問須菩提可以三十二相見如來否須菩提言如來之相雖勝妙殊絶不宜以形色求之何以故蓋如來所説相者非真相也妙體如如湛然常寂乃諸佛本心也是名三十二相須菩提若有善男子善女人以恆河沙等身命布施若復有人於此經中乃至受持四句偈等為他人説其福甚多注佛初以大千寶施較經勝次以河沙寶施較經勝皆外財也至此説到身命布施是內財也較財施雖優總是有漏因果不若持經之福勝也此為下文較量身命之始論此第三番較量福德也受持是法身因故福最為殊勝此段經文前以奉持始後以受持終極宜留意蓋真能奉持者稱性而行本心而現莫非金剛全體也講由斯以觀益信持經之福勝矣須菩提世間所重者莫過於身命若有人以恆河沙之多比此身命布施如摩頂放踵利天下為之其所獲之福比寶施有加焉但不明本性特頑福而已若以此經及四句偈等受持而講説之則自利利他其獲福無量較彼捨身者不甚多乎此金剛般若波羅蜜所當受持也彚解自須菩提問經名至此凡四節為一段是一部經點眼處通段皆言般若法以答奉持之意般若非般若是言智體無相以下離文字相故無所説離煩惱相故非微塵離人天相故非世界乃至離佛色身故非三十二相一切無所著方是般若法方是真受持此成就第一希有之法非身命施所能及也故下文但讚嘆能契此理以教人者其福無量爾時須菩提聞説是經深解義趣涕淚悲泣而白佛言希有世尊佛説如是甚深經典我從昔來所得慧眼未曾得聞如是之經世尊若復有人得聞是經信心清淨即生實相當知是人成就第一希有功德世尊是實相者即是非相是故如來説名實相注聞字與前願樂欲聞相應聞説是經三句摹寫空生之聞境下數聞字空生自寫其聞境即以能聞望人也經以般若為名般若以無相為主不住於相便是此經之義義之究竟歸著處為趣不住於相則生實相便是義中之趣空生傷覺悟之晚故感極涕零也甚深經典即般若非般若之法信心者信無我四相而修不住之行也清淨者即人法兩空不住於相也實相者即清淨法身非有非無不生不滅如如不動實相般若也生實相者蓋人心本自清淨以住相故生虗妄以不住相即顯自性故生實相也實相即是本性空淨非有形相可執故下轉語云是實相者即是非相論此善現因自己幸聞此經而願當世之聞經淨信以生實相也佛説如是甚深經典不惟人空而且法空并般若智相亦空昔得慧眼於有見空今聞此經於空亦遣人能解此經義信自心本來清淨保此湛然之本體由是妄念全消天理常住實具般若所謂生實相也實相即從無相中生出猶鑑空即能照也實相即是非相者猶鑑中本無形也佛説無相處俱是説實相處生實相三字要著眼後人目釋氏為空門專言虗無寂滅豈不罪過講上言般若之法爾時須菩提深解無相之義趣涕淚悲泣傷聞經之晚白佛言希有世尊佛説如是深奧經典我從來修行雖具慧眼聞法甚多未曾如此之妙者我既聞此經已悟自性清淨中本來有此真實矣若再有人聞是經典一念發篤信之心其心純是天真毫無欲塵所纍便得清淨般若則性中具如來法身即生實相當知是人成就第一希有功德矣世尊是實相者即真空自性本無形迹是故如來所説實相總屬鏡花水月豈真有實相之可名哉世尊我今得聞如是經典信解受持不足為難若當來世後五百歲其有衆生得聞是經信解受持是人則為第一希有何以故此人無我相無人相無衆生相無壽者相所以者何我相即是非相人相衆生相壽者相即是非相何以故離一切諸相即名諸佛注信解者心無所疑而了然悟也受持者心既領悟而守之堅也無四相證人空也四相即非相證法空也離一切相并空見亦忘也如是乃為清淨名諸佛所謂生實相也論上文聞經為現在世人言此願後世之聞經信持以徵離相也空生甫幸自聞即以能聞望人且望後來五百歲之衆生一則曰第一再則第一與佛以獲福歆動持説者同一惓切又恐衆生誤認受持讀誦全在章句於自家善根不能生發故先言信心清淨次言信解以示受持讀誦之本無我四相證入空智也若止能證人空尚屬二乘何為希有而是人更解諸法本來寂滅諦見四相即是非相證法空智矣法空尚是菩薩何云第一而是人又解非法之空亦空淨悟三空契合實理靈光發現可證清淨法身矣故曰即名諸佛講須菩提曰我親侍如來得聞妙法自能信其言之實解其理之妙聽受而持守之不為難事若末法濁世離佛遙遠茫茫苦海而能歸依佛教聞是經而信解受持此人明了自性真第一等人甚為希有何也以其頓悟真空四相俱無也是人所以無四相者何也為他信心清淨了知五蘊本來空寂我相即是非相彼此原來絶待人相即是非相萬象一法所印衆生即是非相億劫不出剎那壽者即是非相既悟諸相非相之旨所以當體全空也又何以知四相非相蓋無相是人空非相是法空人法俱空并空見亦忘即到覺位可以名為佛矣佛告須菩提如是如是若復有人得聞是經不驚不怖不畏當知是人甚為希有何以故須菩提如來説第一波羅蜜即非第一波羅蜜是名第一波羅蜜石本非第一上無即字注如是如是印許善現所言亦以接引後世也怪愕曰驚惶恐曰怖退縮曰畏能信解受持實相現前乃能不驚不怖不畏故曰希有金剛般若貫徹五度為第一波羅蜜非第一者是清淨之心是名第一者乃圓證之詣論此因空生既能解悟便要他實行般若以證實相也六波羅蜜中惟般若能成就法身故云第一前言般若即非般若是就般若一波羅蜜而言乃無相體性也此第一即非第一是對餘五波羅蜜言而説六度總一般若萬行同成第一以起下忍辱布施離一切相之意也般若為第一又併第一而遣之經義所以微妙講佛因須菩提之言即印可之曰汝言深契佛理如是如是後果有人得聞般若妙法不驚而無疑心不怖而無懼心不畏而無退心則諦聽受持永無退轉此人甚為希有何也諸波羅蜜以般若為第一然乃真空無相貫徹五度即非第一之可名而般若能成就法身是名第一波羅蜜也須菩提忍辱波羅蜜如來説非忍辱波羅蜜是名忍辱波羅蜜何以故須菩提如我昔為歌利王割截身體我於爾時無我相無人相無衆生相無壽者相何以故我於往昔節節支解時若有我相人相衆生相壽者相應生瞋恨須菩提又念過去於五百世作忍辱仙人於爾所世無我相無人相無衆生相無壽者相古本無是名忍辱波羅蜜句注六度中最難離相者無如忍辱一度被人毀害曰辱我能安受曰忍説非忍辱是忍而無忍也如我一證是極苦忍亦非忍也無四相正明非忍也與前度生無四相持經無四相互為發明歌利華言極惡昔如來證初地時山居修道王帶宮女出獵困倦而寢諸女入山禮仙王覺大怒入山尋之問仙以何為戒曰以忍為戒王割截仙人肢體四天王怒雨沙石王怖畏懺悔仙身復如故王後歸信受記即憍陳如也念過去一段又追述前因言佛所修非止一世一事也論上言非第一波羅蜜明般若貫徹五度猶恐菩薩未能通達此旨故於六度中舉忍辱以證離相也持戒精進禪定般若悉在心上修習布施忍辱則見於事為菩薩饒益有情正於事為徵心故經中言忍辱布施以攝餘度而忍辱一度最難克化此見性之後習定修慧最要關頭所以菩薩當行忍辱波羅蜜然人忍辱為難忘忍尤難見有辱可忍即不能忍矣忍辱從般若而出本然之心寂然不動外不見有所辱之相內不見有能忍之念是般若體中本無我人誰辱誰忍如是方能離相方是真正實相般若也講佛告須菩提不但般若波羅蜜本無迹象無可執著即我所説忍辱波羅蜜此實有形相可見者然一念清淨煩惱自息外不見有所辱內不見有所忍橫逆之來渾然兩忘此如來説非忍辱波羅蜜祇虗名為忍辱波羅蜜而已如我昔為歌利王割截身體時心如虗空不起四相何以故當初節節支解可謂辱之極矣若有四相瞋恨心生何以言忍又念曾於五百世作忍辱仙人亦無四相之纍歷劫自能頓悟真空此我之所修非止一世一事已也是故須菩提菩薩應離一切相發阿耨多羅三藐三菩提心不應住色生心不應住聲香味觸法生心應生無所住心若心有住即為非住是故佛説菩薩心不應住色布施須菩提菩薩為利益一切衆生故應如是布施如來説一切諸相即是非相又説一切衆生即非衆生利益衆生句下古本無故字注上言忍行何故忽言發心蓋菩薩先當發心也兩是故字總束上文離相發心則所發之心即無所住之心也發則生矣但前云應無所住而生其心恐人認作兩層有無所住之心又有所生之心轉非清淨故直曰生無所住心言生此原無所住之心也若心有住即為非住者謂住於色等即不住於菩提也再引佛説布施一度申明離相發心之義住色布施該聲香等在內上先言不住相等布施再言不住色等生心此則言不住色等生心即不住色布施以融合上文之義此布施指法施言滅度衆生即是利益衆生也末四句結上意言菩薩應離一切相者因一切諸相因緣而生盡是假合相即非相也菩薩利益一切衆生者因衆生各明本性即是諸佛生即非生也論此承上忍辱無相而言教諸菩薩離相發心又於六度中舉布施以證離相也離相所發之心即正等覺心故學佛者直發菩提心當使此心湛然隨處解脫空諸所有斯為離一切相佛恐人認離相為虗無故以利益二字指示實際蓋必利人福德益人智慧實實有其功用始為滅度衆生此是菩薩宏誓之願勸修之本但因衆生住著根塵故廣行化導若布施者先有住著何以化彼住著之心所以決當如是布施然後自性獲清淨無為功德而衆生亦受清淨無為之利益也自此至不可思議總在功德上説講佛告須菩提是故諸菩薩當空此心離去一切形相方可發無上菩提心不當住著色聲香味觸法而起可欲之心當生無所住著之心則此心圓通無礙真純無欲非一切諸相所能繫縛若心於六塵有所住著即所住不是菩提心矣所以如來嘗説菩薩之心莫不欲布施但衆苦之本眼根不淨為先不應住於色而為之布施也須菩提菩薩布施原為利益一切衆生使衆塵不隔真智現前故應如是無住相布施方獲真利益所以如來説一切諸相者其實當體全空即是非相也又説一切衆生者其實衆生若見自性即非衆生也須菩提如來是真語者實語者如語者不誑語者不異語者須菩提如來所得法此法無實無虗須菩提若菩薩心住於法而行布施如人入暗則無所見若菩薩心不住法而行布施如人有目日光明照見種種色須菩提當來之世若有善男子善女人能於此經受持讀誦則為如來以佛智慧悉知是人悉見是人皆得成就無量無邊功德注真語不妄也實語不虗也如語稱理而語也不誑非詭託欺偽之言不異不涉怪異亦無互異也如來所語之法即如來所得之法法乃無為真如之法也法體空寂無相可得故云無實非相即相有真空體故云無虗虗實二字合説有味虗中悟出實際實中悟出虗理虗實相形乃成如來妙法住則著相為煩惱所障故云入暗無住則人我兩忘智光獨照故云見種種色未言離相持經功德以印可空生第一希有功德之語起下段之義論此揭出即空不空之如來藏以見離相即生實相欲人不住於相以成就功德也如來所説法總是無上菩提欲人了悟佛法實則墮入常見虗則墮入斷見心體無相不可言實妙用無方不可言虗真空妙用法性如是即應無所住行於布施也心住於法者於因中未淨六塵謂行善可以作福於佛道神妙感通智慧覺人之本量猶未夢見若此心全從一片慈悲中流出迎機善導輾轉濟人使五濁衆生咸登彼岸是乃洞徹源流性光燭照此正布施利益也得真如由心淨心淨由不住法不住法由有智有智由聞經當知此經有其勝德故須讚歎以示將來也講佛曰我如來所説般若波羅蜜者皆無上菩提了悟本性真而不妄實而不虗如如而不變其詞非欺誑之言非異常之論如來所以得此般若法者只是空無所空之心法將以法為實耶真體空寂本無實也以法為虗耶妙用無方亦無虗也故修行菩薩當悟真空不宜有所住著以為布施若心著於法而行布施則四相未空為無明障如人人暗室中昏無所見矣若心無所著而行布施則圓悟如來洞達無礙如人有眼目又得杲日當空見種種色矣若後世有善男女能受持讀誦此經直下頓悟真空即到菩提覺位為自性如來佛以智慧之目盡知盡見豈不成就無量無邊功德哉須菩提若有善男子善女人初日分以恆河沙等身布施中日分復以恆河沙等身布施後日分亦以恆河沙等身布施如是無量百千萬億劫以身布施若復有人聞此經典信心不逆其福勝彼何況書寫受持讀誦為人解説注初日中日後日以一日言早中晚三時也恆河沙言其多無量劫言其久皆備喻也佛所謂捨身布施非真有此事即儒家損己益人之説信心即前信心清淨不逆即前不驚不怖不畏是與般若契合一心隨順也聞經信心無有違逆祇是耳根勝也何況六根清淨又有勝焉者書寫手具般若身根勝也受持心具般若意根勝也讀誦口具般若舌根勝也此自利之功至為人解説又是利他之德論此第四番較量福德也但捨身命不能見性仍為有漏業因聞經信心頓見自性一志修行更無退轉此人得般若之福大勝命施之福書寫持説是從般若光中流出語言文字代佛宣揚非徒紙上陳言依文解義可比講佛言設有善男女於一日之間以恆河沙等身命三度布施至於無量數劫則福報曷可勝言然止能受世間頑福耳若有人聞此經既信於心不違其説其福尚勝捨身之福何況書寫章句而尋繹其言受持讀誦而解悟其理又以是經與人解説其義則不徒自明己性且教人各見其性善根純熟利益無窮其福豈有限量哉彚解自深解義趣至此凡七節為一段空生聞般若經名之後自陳悟解嘆信經之人生實相徵離相為第一希有佛因言實相般若為六度第一復舉忍辱布施以例其餘教以從解起行於六波羅蜜上一一離相發心以利益衆生而以無實無虗括般若之宗旨無實則萬法皆空離相是也無虗則一真常住實相是也正是菩提妙境又借入暗處明推明相無可住之故復較量福德一番以見般若能人己兼成非捨命所能及也須菩提以要言之是經有不可思議不可稱量無邊功德如來為發大乘者説為發最上乘者説若有人能受持讀誦廣為人説如來悉知是人悉見是人皆得成就不可量不可稱無有邊不可思議功德如是人等即為荷擔如來阿耨多羅三藐三菩提何以故須菩提若樂小法者著我見人見衆生見壽者見則於此經不能聽受讀誦為人解説須菩提在在處處若有此經一切世間天人阿修羅所應供養當知此處即為是塔皆應恭敬作禮圍繞以諸華香而散其處注要宗也語必歸宗也是經即文字中所詮實相般若也乘即車乘取法輪轉通之義大乘菩薩乘也最上乘佛乘也六祖曰法無三乘人心自有差等見聞轉誦是小乘悟法解義是中乘依法修行是大乘萬法盡通萬行俱備一切不染離諸法相一無所得名最上乘發謂修行人發心也上功德以經中自有之功德言下以人所成就之功德言荷擔直將佛法肩承在身上也小法外道也前言四相主六塵説尚粗此言四見主六根説稍細妄見又為妄相根本前言塔廟是説經處此是有經處各有分別諸華香謂寶花妙香也論此總承上文言是經微妙惟發大乘人能荷擔佛法也發大乘最上乘即是發阿耨多羅三藐三菩提心菩薩為已發最上乘人善男女為能發最上乘人衆生為未發最上乘人然未發上乘實是能發上乘者如來護囑菩薩為已發上乘者説正為能發上乘未發上乘者説也荷擔者以菩提本於如來示正法授受之宗如來護念付囑專是求荷擔之人末言此經具佛全身但流布處即是法身常住收足持經之義圓滿周遍蓋盡人望之矣講須菩提要而言之是經不可以心思口議不可以物稱器量有無邊功德所以如來不輕為人説惟為發菩提心大根器人説也若果有人受持讀誦廣為人説如來悉知之而悉見之功用德行皆可成就此人即能以如來無上菩提之法一身擔任之豈樂小法者可比哉蓋樂小法者迷於外道不免有人我等見之私其於真性茫然不知故不能聽受讀誦為人解説也不知此經普示一切至微至妙須菩提在在處處有此經典一切世間天人阿修羅為之供養當知此處即是如來真身舍利寶塔能使遐邇瞻仰恭敬而一心嚴肅作禮而五體投地圍繞而大衆歸依以諸花香而布散於持經之處則供養可謂至矣洵乎信心持説者便能荷擔菩提也復次須菩提若善男子善女人受持讀誦此經若為人輕賤是人先世罪業應墮惡道以今世人輕賤故先世罪業即為消滅當得阿耨多羅三藐三菩提注輕賤謂疾病貧窮小而憂辱大而死亡皆是先世指前生其實昔日向惡今日向善在生轉換一番亦謂之世六祖以先世今世作前念後念亦通惡道地獄餓鬼畜生即三塗也入福德門則先世罪業消滅入智慧門則得阿耨菩提論上言受持得福此言受持滅罪前為大乘言功德此為下乘言果報也果報之説最能感動世人故略言之人見持經者現生轗軻受人辱罵輕賤便謂無益而生退阻故佛言因果破之正為修法者堅其志耳放下屠刀立地可以成佛無邊苦海回頭便即誕登持經見性換骨脫胎所謂莫拋造物鈞陶外廣渡無邊大法船也講持誦此經宜為天人恭敬而不免人之輕賤鮮不以持誦為無益矣佛故曰須菩提人能持誦此經即為荷擔正法應為天人恭敬若反為人輕賤當是夙世大有罪業縱貪嗔癡恣身口意應墮入三惡道中今仗持經功德祇受輕賤之罰前生罪業即為消除況今覺心一起罪滅福生因除果現當得無上菩提矣須菩提我念過去無量阿僧祇劫於然燈佛前得值八百四千萬億那由他諸佛悉皆供養承事無空過者若復有人於後末世能受持讀誦此經所得功德於我所供養諸佛功德百分不及一千萬億分乃至算數譬喻所不能及須菩提若善男子善女人於後末世有受持讀誦此經所得功德我若具説者或有人聞心則狂亂狐疑不信須菩提當知是經義不可思議果報亦不可思議注阿僧祇華言無央數劫猶世也於然燈佛前謂未遇然燈佛以前也值猶遇也那由他華言一萬萬具説詳言也具説功德者如彌陀經所言極樂國土成就如是功德莊嚴是也狂亂癡妄也狐疑搖惑也果報應驗也論此第五番較量福德總結持經功德之不可思議也佛復自為貶損以顯受持之功德供養者承事無量佛不如受持者荷擔一如來是言供養不及受持非是佛不如末世之人也具説功德有許多感應果報事在所以易起人狂亂疑惑然果報終不可思議佛不計果報正極言是經之勝欲堅人信受也末段是總結經義二句又結中之結講佛言如我於無央數劫在然燈佛前得遇八百四千萬億那由他諸佛出世盡供奉而不怠承順而無違無有一處空過者我歷事諸佛之多如此若後末世有持經之人見自本性永脫輪回以是功德較我供佛之功德雖百千萬億分算數之多譬喻之廣皆不及持經功德之一分也若善男女於末法時受持讀誦所得功德我若具言其詳下根人聞之生癡妄心否則疑惑不信必以我言為夸矣當知此經之義趣與功德之果報皆不可以心思口議哉彚解自以要言之至此凡三節為一段總承上文言是經之勝在於無相人能離相發心受持廣説與樂小法者何啼霄壤成就功德荷擔如來罪業消除得成正覺豈供養諸佛所可及哉此後讚歎俱絶故疊以不可思議結之自篇首須菩提問安住降伏佛示以無相之旨經義已是了然隨因善現問實信請經名願衆生後世生實相證離相而如來隨機指示大要教人生清淨心乃可證菩提也末段極讚歎持説功德之勝堅人淨信住降之義至此已盡是為經之上卷以下只就上篇意而反復申明之慈悲深重不厭再三固非復説也
