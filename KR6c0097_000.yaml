front:
  text: 佛法無邊人天歸敬五蘊皆空六根清淨妙典常存虔持必應苦海難逾神扶自定災劫無憂惟操本性口誦不離驅邪却病萬法了電一心如鏡始悟前因猛然深醒廣勸世人真言可聽時咸豐八年歲在戊午秋八月佛弟子黃樂之敬書金剛經源流釋教之興肇於中古昔有至人名然燈轉大法輪教化度脫而佛法始著逮周昭王甲寅歲四月八日天竺迦維衛國淨梵王誕生太子即釋迦牟尼三十二相八十種好以夙願故舍國修道雪山六載精思苦行於臘月八日覩明星出見豁然頓悟具六通識為三界尊闡教西方而佛法於是大盛佛初詣鹿苑後住祇阿林講説大法四十九年是時同聽法會者凡數千人有大弟子迦葉尊者得佛正法藏佛親為授記是為西土初祖有慧命須菩提尊者解空第一有舍利弗尊者智慧第一皆能傳佛心要二祖阿難尊者多聞第一於佛滅後宣揚教典般若全部六百卷皆其所傳也後漢明帝感夢金人遣使天竺訪尋佛法白馬馱經中土之有經典自此始傳至二十八祖達摩尊者以大神通收攝三十六處邪魔外道設洪誓願自西印度歷恆河沙以至震旦凡三周寒暑達於南海時梁普通七年庚子九月草一日也説法演教宗門大啓其傳授密旨大抵從超悟得明心見性參悟本來是為東土初祖自達摩西來傳心印於二祖慧可大師且以楞伽經四卷付之云是如來心地要門令諸衆生開示悟入至五祖宏忍大師始易以金剛經傳授嘗勸僧俗但持金剛經即自見性成佛故曹溪六祖聞經中應無所住而生其心句遂傳五祖衣鉢則金剛經之能成佛信已是經也為世尊第九會説法佛説此甚深經典蓋為諸衆生解諸煩熱化清涼境拔諸苦惱離火宅厄濟諸幽魂超地獄趣化諸六道獲天人樂誠昏衢之智燭苦海之慈航也學禪者果能掃除一切冥心內觀寂坐元默惟歸於空空無所空洞達無礙是為參無上大乘即或朝夕諷誦信心受持亦可以了夙世因脫三塗苦罪業消滅獲福無窮矣嗟乎擾擾匇匇晨雞暮鐘證慧業於菩提渡迷津以寶筏西來大意如是如是至各書所載持誦金剛經功效捷於影響茲不復贅淨如居士雲鶴徐槐廷敬述彚纂引用書目隋天台智者大師疏法名智顗唐曹溪法師直解六祖法名慧能圭峯禪師疏論纂要法名宗密宋長水大師刊定記法名子中峯禪師略義龍舒居士王日休注致政陳雄注明憨山大師決疑法名德清宗泐禪師經解法名如又名曉月曾鳳儀宗通李騰芳集解張有譽義趣廣演號大圓居士似空法師金剛鎞法名廣伸張國維疏解號如如居士鈔本蓮士大師注説王化隆直指洪蓮和尚集注採集五十三家本朝剩間居士龔穊綵集解誠齋居士盛符升五釋黃成釆經貫王履昌句解無名氏芥疏鈔本顧旦初圓旨范季珍如解經旨提要俱摘大圓居士石成金注論講證陸騰金剛經演説據注云此書甚佳購之未得附記圓通文尼自在光佛直解降乩筆沖元道人注疏東樵山人直説孫念劬彚纂復復道人疑記例言是經梁昭明太子標為三十二分然細繹段落恐不止是每分標題亦未盡賅且如推窮四果漸至如來正緊接然燈佛所一段何割截屬下莊嚴爾時慧命須菩提問説法信心雖承接上文究另有所請不得併為一分其餘宜分宜合不一而足是編段落彚合諸家折衷至當非敢臆説也然三十二分相沿已久未可抹煞茲將每分所標名目列於眉端是經當分看憨山辨為上下兩卷甚當然自從大衆起至即見如來止統是大乘正宗蓋安住降伏不著形相全經大旨已竟自後善現問實信則示以清淨問經名則示以般若問信解受持則示以離相發心層層闡發意旨淵深後又贊歎是經之妙勸人受持讀誦直至不可思議止俱是談般若法以洗發住降之義是為上卷須菩提聞佛所説深解義趣至於涕淚悲泣豈有復昧住降之理再為啓請後人注解謂前言粗執後言細執前為初發心者言後為已發心者言均屬非是蓋善現恐後世未能親承佛語之善男女發菩提心者無所遵行欲佛立一法以普示將來佛故以實無有法破之以後節節申解上卷未盡之義俱有妙旨各不相承末揭出不取於相如如不動為全篇總結住降之旨洞徹無遺是為下卷金剛經無前半部則演説不開無後半部則搜括不盡是經當合看一卷如一章一章如一句一句如一字何為一字昔趙洲禪師每遇學人入室令參無字為話頭這一無字函蓋乾坤包羅萬象識得金剛經無相宗旨全經可作一字讀也是經解義分注論講三字仿石注本也注者將正文字句逐一破解也論者將本文精義辨析論斷也講者順如來善現口氣以為演發也至每段綱領脈絡承接界畫處則參以彚解數語條分縷析段落分明不至字比句櫛依文解義可比其所採録先止四五家後得孫述甫彚纂一書搜羅甚富共有數十家復加刪訂彚成一册諸家姓氏不備書者緣參雜成文不便注明非掠美也是經阿難結集語句用尖須菩提語句用點如來語句用圈以別之通篇扼要關鍵處用雙圈一節精深微妙處用連圈功效處用連點前後關照及眉目處用連尖以醒之誦經要法何必靜室世人誦經多覔靜室殊不知堅誠全在於心而不在於境也本心若靜雖居鬧市亦是深山試看吾儒善讀書者挂角而讀帶經而鋤竟以成功何在於書室之靜乎何必出家出家原為脫離罣礙每見有等僧人貪戀之心仍在如此出家反不如在家而有出家之行者轉為上等試看古今在家善信得悟菩提者甚多如傅大士龐居士諸公俱有妻子塵纍於道無礙可知全不在乎出家也何必設像對佛誦經意在起人敬畏殊不知誦之有益無益只論心之誠否心若不誠雖時刻與聖像不離亦何益矣何必急誦誦經全在口讀其文心思其義只要字句明朗微旨了徹雖低默讀誦俱為上乘若是急急趕讀含糊圖快未免到口不到心縱然讀過萬遍經義不解原與不讀者相同何必跪諷參悟經義不拘行住坐臥無有不可何必專在於跪何必全部此經注解非細加參詳則妙義不明若人事匇忙之際何能全讀須知塵事稍間息心看一段可得一段之益解一節即有一節之功試看六祖當日只聞經中應無所住而生其心句即證菩提可見惟在學人心悟如何豈計其語句多寡耶按讀誦經注原可隨時分段細加參詳以期解悟固難一時全讀至於持誦經文須於每日平明時或人定後既無人事之擾息心端坐口誦心維或一遍或數遍務令一念不起久久行之大有利益
